name: liquid_glass_engine
description: Physically exact liquid-glass refraction for Flutter - exact Snell optics on the GPU, a drop-in widget, zero engine-code changes to integrate.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_core:
    path: ../liquid_glass_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  shaders:
    - shaders/liquid_glass.frag
